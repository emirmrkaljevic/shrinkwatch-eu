name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx --yes web-ext@8 lint --source-dir dist/firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zips
          path: dist/*.zip
